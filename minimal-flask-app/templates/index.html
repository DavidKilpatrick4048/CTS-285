<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minimal DataMan Flask Starter</title>
</head>
<body>
  <main>
  <h1>DataMan Answer Checker</h1>
  <p><strong>Problem:</strong> {{ problem }}</p>

  {% if next_try is not none %}
    <p><strong>Try:</strong> {{ next_try }}</p>
  {% endif %}

  {% if message %}
    <p><strong>Result:</strong> {{ message }}</p>
  {% endif %}

  {% if next_try is not none %}
    <form method="post" action="/answer">
      <label for="answer">Your answer</label>
      <input id="answer" name="answer" inputmode="numeric" required>
      <button type="submit">Check answer</button>
    </form>
  {% else %}
    <p>This round is complete.</p>
  {% endif %}
</main>
</body>
</html>
